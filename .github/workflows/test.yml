name: Test action

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      vipi-ref:
        description: Test with this Git ref of EnXan/VIPI instead of the pinned PyPI release
        required: false
        default: ""
      cloud-scan:
        description: Also run a real cloud scan of two images (paid, about $0.01; needs provider secrets)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  summary:
    name: summary script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  selection:
    name: selection (${{ matrix.case }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: empty-diff
          - case: base-rules
          - case: branch-rules
          - case: exclude-input
            exclude: generated/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: vipi-action
          persist-credentials: false

      - name: Create fixture repository
        env:
          CASE: ${{ matrix.case }}
        run: vipi-action/tests/fixture.sh "$CASE"

      # Default cloud mode without keys: no models are downloaded, and remaining
      # images fail before OCR, which keeps the test free and fast.
      - name: Run action
        id: vipi
        continue-on-error: true
        uses: ./vipi-action
        with:
          base-ref: main
          exclude: ${{ matrix.exclude }}
          vipi-ref: ${{ inputs.vipi-ref }}
        env:
          GOOGLE_CLOUD_API_KEY: ""
          OPENAI_API_KEY: ""

      - name: Check report
        env:
          CASE: ${{ matrix.case }}
          REPORT: ${{ steps.vipi.outputs.report-path }}
          SELECTED: ${{ steps.vipi.outputs.selected-images }}
          OUTCOME: ${{ steps.vipi.outcome }}
        run: python3 vipi-action/tests/check_report.py "$CASE" "$REPORT" "$SELECTED" "$OUTCOME"

  # Without base-ref, the Action scans all images under paths. PR events always
  # diff against the PR base, so this case runs on pushes and manual runs only.
  full-scan:
    name: selection (full-scan)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: vipi-action
          persist-credentials: false

      - name: Create fixture repository
        run: vipi-action/tests/fixture.sh full-scan

      - name: Run action
        id: vipi
        continue-on-error: true
        uses: ./vipi-action
        with:
          vipi-ref: ${{ inputs.vipi-ref }}
        env:
          GOOGLE_CLOUD_API_KEY: ""
          OPENAI_API_KEY: ""

      - name: Check report
        env:
          REPORT: ${{ steps.vipi.outputs.report-path }}
          SELECTED: ${{ steps.vipi.outputs.selected-images }}
          OUTCOME: ${{ steps.vipi.outcome }}
        run: python3 vipi-action/tests/check_report.py full-scan "$REPORT" "$SELECTED" "$OUTCOME"

  # Real scan with the default providers: paid, so manual and opt-in only.
  cloud-scan:
    name: cloud scan (paid)
    if: github.event_name == 'workflow_dispatch' && inputs.cloud-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: vipi-action
          persist-credentials: false

      - name: Run action
        id: vipi
        continue-on-error: true
        uses: ./vipi-action
        with:
          paths: |
            vipi-action/tests/images/injection.png
            vipi-action/tests/images/benign.png
          vipi-ref: ${{ inputs.vipi-ref }}
        env:
          GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Check report
        env:
          REPORT: ${{ steps.vipi.outputs.report-path }}
          SELECTED: ${{ steps.vipi.outputs.selected-images }}
          OUTCOME: ${{ steps.vipi.outcome }}
        run: python3 vipi-action/tests/check_report.py cloud-scan "$REPORT" "$SELECTED" "$OUTCOME"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-scan-report
          path: ${{ steps.vipi.outputs.report-path }}

  # Posts a real comment on this PR, runs again to check that it is updated
  # instead of duplicated, then deletes it. Fork PRs cannot comment.
  pr-comment:
    name: pr comment
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: vipi-action
          persist-credentials: false

      - name: Create fixture repository
        run: vipi-action/tests/fixture.sh branch-rules

      - name: Run action
        continue-on-error: true
        uses: ./vipi-action
        with:
          base-ref: main
          pr-comment: true
        env:
          GOOGLE_CLOUD_API_KEY: ""
          OPENAI_API_KEY: ""

      - name: Run action again
        continue-on-error: true
        uses: ./vipi-action
        with:
          base-ref: main
          pr-comment: true
        env:
          GOOGLE_CLOUD_API_KEY: ""
          OPENAI_API_KEY: ""

      - name: Check and delete the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ids=$(gh api "repos/$REPOSITORY/issues/$NUMBER/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- vipi-action-report -->")) | select(.user.type == "Bot") | .id')
          count=$(printf '%s\n' "$ids" | grep -c . || true)
          for id in $ids; do gh api -X DELETE "repos/$REPOSITORY/issues/comments/$id"; done
          if [[ "$count" != 1 ]]; then
            echo "Expected one VIPI comment, found $count." >&2
            exit 1
          fi
          echo "One VIPI comment was posted and updated."
